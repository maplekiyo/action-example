name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            Review this pull request with a focus on:
            - Correctness and potential bugs
            - Security implications
            - Performance considerations
            - Test coverage for new behavior

            The PR branch is already checked out in the current working directory.
            Follow any conventions described in CLAUDE.md if present.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            for issues tied to specific lines.

            Always finish by posting ONE summary comment with `gh pr comment`, even if you
            found no issues. Format it like this:

              @<PR AUTHOR> Claude review finished. <one-line verdict>

              ### 🔴 Must fix
              - ...
              ### 🟡 Should fix
              - ...
              ### 🟢 Nits
              - ...

            Leave out empty sections. If there are no issues, write
            "✅ No issues found." after the mention.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

